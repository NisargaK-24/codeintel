[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeintel"
version = "0.1.0"
description = "Intelligent Zombie Code Detection and Predictive Commit Risk Analysis (No-LLM Static Code Intelligence)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CodeIntel Project Team"}
]
keywords = [
    "static-analysis",
    "ast",
    "zombie-code",
    "dead-code",
    "code-quality",
    "git-analysis",
    "change-impact",
    "software-metrics"
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "pathspec>=0.11.0",
    "dulwich>=0.21.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
codeintel = "codeintel.main:cli_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "sample_repo", ".git", ".venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
